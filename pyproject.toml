[project]
name = "research-agent-for-slack"
version = "0.1.0"
description = "Slack のメンションをサーバー上の Claude Code に渡し、結果をスレッドに返す bot"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.18",
    "python-dotenv>=1.0",
]

[project.scripts]
research-agent = "research_agent.bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
